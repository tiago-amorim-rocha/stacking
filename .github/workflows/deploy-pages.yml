name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Generate fresh version metadata for this deploy
        env:
          GIT_SHA: ${{ github.sha }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          ts=$(date +%s%3N)
          iso=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          short_sha="${GIT_SHA:0:7}"
          build_id="${GIT_SHA:0:16}"

          TS="${ts}" ISO="${iso}" SHORT_SHA="${short_sha}" BUILD_ID="${build_id}" COMMIT_MESSAGE="${COMMIT_MESSAGE}" \
            python - <<'PYMETA'
          import json
          import os
          from pathlib import Path

          payload = {
              "timestamp": int(os.environ["TS"]),
              "date": os.environ["ISO"],
              "buildId": os.environ["BUILD_ID"],
              "gitHash": os.environ["SHORT_SHA"],
              "commitMessage": os.environ.get("COMMIT_MESSAGE", ""),
          }

          Path("dist/version.json").write_text(json.dumps(payload, indent=2) + "\n")
          Path("dist/version.txt").write_text(f"{payload['timestamp']}\n")
          PYMETA

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload static artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
