name: Auto-update version metadata on main commits

on:
  push:
    branches:
      - main
    paths-ignore:
      - version.txt
      - version.json

permissions:
  contents: write

jobs:
  update-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update version files
        run: |
          TIMESTAMP=$(date +%s%3N)
          DATE_ISO=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          BUILD_ID=$(openssl rand -hex 8)
          GIT_HASH=$(git rev-parse --short HEAD)
          COMMIT_MESSAGE=$(git log -1 --pretty=%s | sed 's/"/\\"/g')

          cat > version.json <<JSON
          {
            "timestamp": ${TIMESTAMP},
            "date": "${DATE_ISO}",
            "buildId": "${BUILD_ID}",
            "gitHash": "${GIT_HASH}",
            "commitMessage": "${COMMIT_MESSAGE}"
          }
          JSON

          echo "${TIMESTAMP}" > version.txt

          if ! git diff --quiet version.json version.txt; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add version.json version.txt
            git commit -m "auto: update version metadata"
            git push origin main
            echo "✅ Updated version.json + version.txt"
          else
            echo "ℹ️ Version metadata already up to date"
          fi
