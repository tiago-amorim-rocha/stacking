<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />

  <title>Game Template</title>

  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./icon-512.svg">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Game">
  <meta name="theme-color" content="#0f1115">
  <meta name="mobile-web-app-capable" content="yes">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background: #2d1b3d;
      color: #eee;
      position: fixed;
      width: 100%;
      height: 100%;
      overflow: hidden;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior: none;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: manipulation;
    }

    .container {
      text-align: center;
      padding: 2rem;
    }

    code {
      background: #1a1d23;
      padding: 0.2em 0.4em;
      border-radius: 3px;
      font-size: 0.9em;
    }

    #console-toggle {
      position: fixed;
      bottom: calc(20px + env(safe-area-inset-bottom));
      right: calc(20px + env(safe-area-inset-right));
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: #1a1d23;
      border: 2px solid #333;
      color: #eee;
      font-size: 24px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      transition: all 0.2s;
    }

    #console-panel {
      position: fixed;
      bottom: calc(80px + env(safe-area-inset-bottom));
      right: calc(20px + env(safe-area-inset-right));
      width: 420px;
      max-width: calc(100vw - 40px);
      height: 340px;
      background: #1a1d23;
      border: 2px solid #333;
      border-radius: 8px;
      display: none;
      flex-direction: column;
      z-index: 999;
      font-family: 'Courier New', monospace;
      font-size: 12px;
    }

    #console-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 12px;
      background: #252831;
      border-bottom: 1px solid #333;
      border-radius: 6px 6px 0 0;
      gap: 8px;
    }

    #console-controls {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-wrap: wrap;
    }

    .level-toggle {
      background: #2c313c;
      border: 1px solid #555;
      border-radius: 4px;
      color: #bbb;
      font-size: 10px;
      padding: 2px 6px;
      cursor: pointer;
    }

    .level-toggle.active {
      color: #fff;
      border-color: #8a8a8a;
    }

    #console-clear {
      background: none;
      border: none;
      color: #888;
      cursor: pointer;
      padding: 4px 8px;
      font-size: 11px;
    }

    #console-level-status {
      color: #888;
      font-size: 10px;
      margin-left: 4px;
    }

    #console-output {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
      color: #ccc;
    }

    .console-message { margin-bottom: 4px; word-wrap: break-word; line-height: 1.4; }
    .console-time { color: #666; margin-right: 6px; }
    .console-log { color: #ccc; }
    .console-warn { color: #f1c40f; }
    .console-error { color: #e74c3c; }

    #reload-button {
      position: fixed;
      bottom: calc(20px + env(safe-area-inset-bottom));
      right: calc(80px + env(safe-area-inset-right));
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: #e74c3c;
      border: 2px solid #c0392b;
      color: white;
      font-size: 24px;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      transition: all 0.2s;
      box-shadow: 0 2px 8px rgba(231, 76, 60, 0.4);
    }

    #reload-button.show {
      display: flex;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Template Project</h1>
    <p>Template with version metadata, smart reload, and mobile console.</p>
    <p>Build hash: <code id="build-hash">Loading...</code></p>
    <p>Build date: <code id="build-date">Loading...</code></p>
  </div>

  <button id="console-toggle">🐛</button>
  <div id="console-panel">
    <div id="console-header">
      <span id="console-title">Console</span>
      <div id="console-controls">
        <button class="level-toggle" data-level="log">LOG</button>
        <button class="level-toggle" data-level="warn">WARN</button>
        <button class="level-toggle" data-level="error">ERR</button>
        <button id="console-clear">Clear</button>
        <span id="console-level-status">Showing 0/0</span>
      </div>
    </div>
    <div id="console-output"></div>
  </div>

  <button id="reload-button" title="New version available! Click to reload">🔄</button>

  <script>
  (async () => {
    const hashEl = document.getElementById('build-hash');
    const dateEl = document.getElementById('build-date');

    try {
      const res = await fetch('./version.json', { cache: 'no-store' });
      const version = res.ok
        ? await res.json()
        : { timestamp: Date.now(), buildId: String(Date.now()), gitHash: 'fallback', date: new Date().toISOString() };

      window.__BUILD_INFO = version;
      hashEl.textContent = version.gitHash || version.buildId || 'unknown';
      dateEl.textContent = version.date || new Date(version.timestamp).toISOString();

      const s = document.createElement('script');
      s.type = 'module';
      s.src = `./main.js?v=${encodeURIComponent(version.timestamp || Date.now())}`;
      document.head.appendChild(s);
    } catch (err) {
      console.warn('version.json missing, using fallback timestamp');
      const fallback = Date.now();
      window.__BUILD_INFO = { timestamp: fallback, buildId: String(fallback), gitHash: 'fallback', date: new Date(fallback).toISOString() };
      hashEl.textContent = 'fallback';
      dateEl.textContent = new Date(fallback).toISOString();

      const s = document.createElement('script');
      s.type = 'module';
      s.src = `./main.js?v=${encodeURIComponent(fallback)}`;
      document.head.appendChild(s);
    }
  })();
  </script>
</body>
</html>
